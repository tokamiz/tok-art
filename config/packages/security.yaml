security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Konten für die Verwaltung stehen in der Tabelle admin_user (anlegen: bin/console app:admin:create)
    providers:
        admin_users:
            entity:
                class: App\Entity\AdminUser
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|build)/)
            security: false
        main:
            # lazy: Die Sitzung startet erst, wenn sie gebraucht wird – öffentliche Seiten setzen kein Cookie.
            lazy: true
            provider: admin_users
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: _username
                password_parameter: _password
                enable_csrf: true
                default_target_path: admin
            logout:
                path: app_logout
                target: home
            # Schutz gegen Durchprobieren von Passwörtern: höchstens 5 Versuche pro Minute
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    # Nur die erste passende Regel gilt.
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # In Tests reicht ein schneller Hash.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
